body{background:#f6f3ec;background-image:linear-gradient(#ebe6da 1px,transparent 1px),linear-gradient(90deg,#ebe6da 1px,transparent 1px);
 background-size:28px 28px;font-family:'Inter','Pretendard',sans-serif;color:#2c3a2e;min-height:100vh}
button{font-family:inherit;cursor:pointer}
.wrap{max-width:480px;margin:0 auto;padding:20px 18px 70px}
.top{display:flex;justify-content:space-between;align-items:center;min-height:34px}
.pill{background:#356b45;color:#fff;font-weight:800;font-size:13px;letter-spacing:2px;padding:7px 14px;border-radius:20px;text-decoration:none}

mark{background:#c9e8cf;color:inherit;border-radius:3px;padding:0 1px}
.empty{font-family:'Pretendard';font-size:14px;color:#7a7b70;text-align:center;padding:18px}

  q.oninput = () => search(q.value.trim());
  const last = sessionStorage.getItem('bravo_q') || '';
  if (last) { q.value = last; search(last); }
}

function search(q) {
  sessionStorage.setItem('bravo_q', q);
  $('#homebody').style.display = q ? 'none' : '';
  $('#chips').style.display = q ? 'none' : '';
  if (!q) { $('#hits').innerHTML = ''; return; }
  const ql = q.toLowerCase();
  const hits = allItems().filter(it => [it.expr, it.mean, it.when, it.situation, it.a, it.b, it.ko_a, it.ko_b, it.set.title, it.set.topic]
    .some(f => f.toLowerCase().includes(ql)));
  $('#hits').innerHTML = `<div class="sec">검색 결과 ${hits.length}개</div>` + (hits.length ? hits.map(it => {
    const line = it.key === 'b' ? it.b : it.a;
    return `<button class="hit" data-go="set=${it.set.id}&i=${it.i}"><div class="e">${hl(it.expr, q)}</div>
    <div class="m">${hl(it.mean, q)} · <span class="ko">${hl(it.when, q)}</span></div>
    <div class="s">${hl(line, q)}<br>${esc(it.set.date)} · ${hl(it.set.title, q)}</div></button>`; }).join('')
    : '<div class="empty">아직 그 표현은 없어요. 다른 단어로 찾아볼까요?</div>');
}

/* ---------- 세트: 예습 ---------- */
function study(s, i) {
  const it = s.items[i], n = s.items.length;
  const lines = [['A', it.a, it.ko_a, it.a_audio, it.key === 'a'], ['B', it.b, it.ko_b, it.b_audio, it.key === 'b']];
  app.innerHTML = topbar(homeBtn, s.date) + `<h1>${esc(s.title)}</h1>` + seg(s, 'study') +
    `<div class="dots">${s.items.map((_, k) => `<i class="${k === i ? 'on' : ''}"></i>`).join('')}</div>
    <div class="card study"><div class="sub">표현 ${i + 1} / ${n}</div>
      <div class="expr">${esc(it.expr)}</div><div class="mean">${esc(it.mean)}</div><div class="when">${esc(it.when)}</div>
      <div class="tag"><b>실전</b>${esc(it.situation)}</div>
      ${lines.map(([w, en, ko, au, hot]) => `<div class="line"><div class="who">${w}</div>
        <div class="tx">${hot ? esc(en).replace(esc(it.answer), `<span class="g">${esc(it.answer)}</span>`) : esc(en)}<div class="ko">${esc(ko)}</div></div>${pbtn(au)}</div>`).join('')}
    </div>
    <div class="nav"><button data-go="set=${s.id}&i=${i - 1}" ${i === 0 ? 'disabled' : ''}>← 이전</button>
    ${i < n - 1 ? `<button class="pri" data-go="set=${s.id}&i=${i + 1}">다음 표현 →</button>`
                : `<button class="pri" data-go="set=${s.id}&mode=test">테스트 보기 📝</button>`}</div>`;
}
const seg = (s, m) => `<div class="seg"><button class="${m === 'study' ? 'on' : ''}" data-go="set=${s.id}">📖 예습</button>
  <button class="${m === 'test' ? 'on' : ''}" data-go="set=${s.id}&mode=test">📝 테스트</button></div>`;

/* ---------- 테스트 (세트 9문제 / 랜덤 10문제) ---------- */
function makeQuestions(items, pool) {
  const qs = [];
  items.forEach(it => {
    const others = n => shuffle(pool.filter(o => o.expr !== it.expr)).slice(0, n);
    // ① 빈칸
    qs.push({type: '빈칸 채우기', html: `<div class="qtext">${esc(it.marked).replace(/\[\[.+?\]\]/, '<span class="bl">?</span>')}</div>
      <div class="ko">${esc(it.key === 'b' ? it.ko_b : it.ko_a)}</div>`,
      answer: it.answer, options: shuffle([it.answer, ...others(2).map(o => o.answer)]), it});
    // ② 대화 이어가기
    const other = it.key === 'b' ? it.a : it.b, otherKo = it.key === 'b' ? it.ko_a : it.ko_b;
    const mine = it.key === 'b' ? it.b : it.a;
    qs.push({type: it.key === 'b' ? '대화: 내 답장은?' : '대화: 내가 먼저 한 말은?',
      html: `<div class="line"><div class="who">${it.key === 'b' ? 'A' : 'B'}</div><div class="tx">${esc(other)}<div class="ko">${esc(otherKo)}</div></div>
      ${pbtn(it.key === 'b' ? it.a_audio : it.b_audio)}</div>`,
      answer: mine, options: shuffle([mine, ...others(2).map(o => o.key === 'b' ? o.b : o.a)]), it});
    // ③ 뜻 → 표현
    qs.push({type: '뜻 보고 표현 고르기', html: `<div class="qbig">${esc(it.mean)}</div><div class="ko">${esc(it.when)}</div>`,
      answer: it.expr, options: shuffle([it.expr, ...others(2).map(o => o.expr)]), it});
  });
  return qs;
}

let T = null;
function startTest(s) {
  if (s) { const qs = makeQuestions(shuffle(s.items), s.items), order = q => qs.indexOf(q) % 3;  // 빈칸 → 대화 → 뜻 순서로 묶기
    T = {s, qs: qs.map(q => [order(q), Math.random(), q]).sort((x, y) => x[0] - y[0] || x[1] - y[1]).map(v => v[2]), k: 0, right: 0, miss: []}; }
  else {
    const pick = shuffle(allItems()).slice(0, 10);
    T = {s: null, qs: pick.map(it => shuffle(makeQuestions([it], allItems()))[0]), k: 0, right: 0, miss: []};
  }
  renderQ();
}
function renderQ() {
  const {s, qs, k} = T;
  const head = topbar(homeBtn, s ? s.date : '랜덤 테스트') + `<h1>${s ? esc(s.title) : '전체 세트 랜덤 테스트'}</h1>` + (s ? seg(s, 'test') : '');
  if (k >= qs.length) return result(head);
  const q = qs[k];
  app.innerHTML = head + `<div class="meta">${k + 1} / ${qs.length}</div><div class="bar"><i style="width:${k / qs.length * 100}%"></i></div>
    <div class="card"><div class="qtype">${q.type}</div>${q.html}
    <div class="opts">${q.options.map((o, j) => `<button class="opt" data-o="${j}">${esc(o)}</button>`).join('')}</div><div id="fb"></div></div>
    <div class="nav" id="next" style="display:none"><button class="pri" data-next>${k === qs.length - 1 ? '결과 보기' : '다음 문제 →'}</button></div>`;
}
function answer(j) {
  const q = T.qs[T.k]; if (q.done) return; q.done = true;
  const ok = q.options[j] === q.answer;
  if (ok) T.right++; else T.miss.push(q);
  document.querySelectorAll('.opt').forEach((b, x) => { b.disabled = true;
    if (q.options[x] === q.answer) b.classList.add('right'); else if (x === j) b.classList.add('wrong'); });
  const it = q.it, line = it.key === 'b' ? it.b : it.a, au = it.key === 'b' ? it.b_audio : it.a_audio;
  $('#fb').innerHTML = `<div class="fb"><div>${ok ? '<b style="color:#2f6b40">정답!</b>' : '<b style="color:#c0392b">아쉬워요.</b>'}
    <b>${esc(it.expr)}</b> · ${esc(it.mean)}<br><span class="ko">${esc(line)}</span></div>${pbtn(au)}</div>`;
  if (ok) play(au);
  $('#next').style.display = '';
}
function result(head) {
  const {s, qs, right, miss} = T, total = qs.length;
  if (s) { const prev = localStorage.getItem(BEST + s.id); const pr = prev ? +prev.split('/')[0] : -1;
    if (right > pr) localStorage.setItem(BEST + s.id, `${right}/${total}`); }
  const msg = right === total ? 'perfect!' : right >= total * .7 ? 'almost there!' : 'one more time!';
  const exprs = s ? s.items.map(i => i.expr) : [...new Set(qs.map(q => q.it.expr))].slice(0, 6);
  app.innerHTML = head + `<div class="result"><div class="pill" style="display:inline-block">BRAVO ENGLISH</div>
    <div style="margin-top:12px">${s ? esc(s.title) : '랜덤 테스트'}</div><div class="score">${right} / ${total}</div>
    <div class="exprs">${exprs.map(e => `<span>${esc(e)}</span>`).join('')}</div><div class="hand">${msg}</div>
    <div class="share">📸 캡처해서 스토리에 올리고 계정 태그해줘요!</div></div>
    ${miss.length ? `<div class="sec">틀린 문제 다시 보기</div><div class="miss">${miss.map(q => `<div class="card"><b>${esc(q.it.expr)}</b> · ${esc(q.it.mean)}
      <div class="ko" style="margin-top:4px">${esc(q.it.key === 'b' ? q.it.b : q.it.a)}</div></div>`).join('')}</div>` : ''}
    <div class="nav" style="margin-top:14px">${s ? `<button data-go="set=${s.id}">📖 다시 예습</button>` : `<button data-go="review">🔀 랜덤 복습</button>`}
    <button class="pri" data-retest>다시 테스트</button></div>`;
}

/* ---------- 랜덤 복습 ---------- */
let R = null;
function review(k) {
  if (!R || k === 0 && !R.keep) R = {list: shuffle(allItems()).slice(0, 10)};
  R.keep = false;
  const it = R.list[k], n = R.list.length;
  const line = it.key === 'b' ? it.b : it.a, au = it.key === 'b' ? it.b_audio : it.a_audio;
  app.innerHTML = topbar(homeBtn, `${k + 1} / ${n}`) + `<h1>랜덤 복습</h1><div class="hand">뜻 보고 떠올린 다음, 카드를 탭!</div>
    <div class="bar"><i style="width:${(k + 1) / n * 100}%"></i></div>
    <div class="flip" id="flip"><div class="inner">
      <div class="face"><div class="bigt">${esc(it.mean)}</div><div class="small">${esc(it.when)}</div><div class="hint">탭해서 뒤집기</div></div>
      <div class="face back"><div class="bigt">${esc(it.expr)}</div><div class="small">${esc(line)}</div>${pbtn(au)}
        <div class="from">${esc(it.set.date)} · ${esc(it.set.title)}</div></div></div></div>
    <div class="nav" style="margin-top:14px"><button data-rv="${k - 1}" ${k === 0 ? 'disabled' : ''}>← 이전</button>
    ${k < n - 1 ? `<button class="pri" data-rv="${k + 1}">다음 카드 →</button>` : `<button class="pri" data-go="rtest">랜덤 테스트 📝</button>`}</div>
    <div class="nav"><button data-go="set=${it.set.id}&i=${it.i}">이 세트 예습하러 가기</button></div>`;
}

/* ---------- 라우팅 ---------- */
function route() {
  const p = new URLSearchParams(location.hash.slice(1));
  window.scrollTo(0, 0);
  if (p.has('review')) return review(0);
  if (p.has('rtest')) return startTest(null);
  const s = p.get('set') && setById(p.get('set'));
  if (s) return p.get('mode') === 'test' ? startTest(s) : study(s, Math.min(Math.max(+p.get('i') || 0, 0), s.items.length - 1));
  home();
}
document.addEventListener('click', e => {
  const t = e.target.closest('button,a'); if (!t) return;
  if (t.dataset.a !== undefined) { e.stopPropagation(); return play(t.dataset.a); }
  if (t.dataset.q !== undefined) { $('#q').value = t.dataset.q; return search(t.dataset.q); }
  if (t.dataset.go !== undefined) { if (t.dataset.go === '') sessionStorage.removeItem('bravo_q'); return go(t.dataset.go); }
  if (t.dataset.o !== undefined) return answer(+t.dataset.o);
  if (t.dataset.next !== undefined) { T.k++; window.scrollTo(0, 0); return renderQ(); }
  if (t.dataset.retest !== undefined) return startTest(T.s);
  if (t.dataset.rv !== undefined) { R.keep = true; return review(+t.dataset.rv); }
});
document.addEventListener('click', e => { const f = e.target.closest('#flip'); if (f && !e.target.closest('button')) f.classList.toggle('open'); });
window.addEventListener('hashchange', route);
route();
</script></body></html>
