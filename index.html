}
const seg = (s, m) => `<div class="seg"><button class="${m === 'study' ? 'on' : ''}" data-go="set=${s.id}">📖 예습</button>
  <button class="${m === 'test' ? 'on' : ''}" data-go="set=${s.id}&mode=test">📝 테스트</button></div>`;

/* ---------- 테스트 (세트 9문제 / 랜덤 10문제) ---------- */
function makeQuestions(items, pool) {
  const qs = [];
  items.forEach(it => {
    const others = n => shuffle(pool.filter(o => o.expr !== it.expr)).slice(0, n);
    // ① 빈칸
    qs.push({type: '빈칸 채우기', html: `<div class="qtext">${esc(it.marked).replace(/\[\[.+?\]\]/, '<span class="bl">?</span>')}</div>
      <div class="ko">${esc(it.key === 'b' ? it.ko_b : it.ko_a)}</div>`,
      answer: it.answer, options: shuffle([it.answer, ...others(2).map(o => o.answer)]), it});
    // ② 대화 이어가기
    const other = it.key === 'b' ? it.a : it.b, otherKo = it.key === 'b' ? it.ko_a : it.ko_b;
    const mine = it.key === 'b' ? it.b : it.a;
    qs.push({type: it.key === 'b' ? '대화: 내 답장은?' : '대화: 내가 먼저 한 말은?',
      html: `<div class="line"><div class="who">${it.key === 'b' ? 'A' : 'B'}</div><div class="tx">${esc(other)}<div class="ko">${esc(otherKo)}</div></div>
      ${pbtn(it.key === 'b' ? it.a_audio : it.b_audio)}</div>`,
      answer: mine, options: shuffle([mine, ...others(2).map(o => o.key === 'b' ? o.b : o.a)]), it});
    // ③ 뜻 → 표현
    qs.push({type: '뜻 보고 표현 고르기', html: `<div class="qbig">${esc(it.mean)}</div><div class="ko">${esc(it.when)}</div>`,
      answer: it.expr, options: shuffle([it.expr, ...others(2).map(o => o.expr)]), it});
  });
  return qs;
}

let T = null;
function startTest(s) {
  if (s) { const qs = makeQuestions(shuffle(s.items), s.items), order = q => qs.indexOf(q) % 3;  // 빈칸 → 대화 → 뜻 순서로 묶기
    T = {s, qs: qs.map(q => [order(q), Math.random(), q]).sort((x, y) => x[0] - y[0] || x[1] - y[1]).map(v => v[2]), k: 0, right: 0, miss: []}; }
  else {
    const pick = shuffle(allItems()).slice(0, 10);

  }

}

}

  const it = q.it, line = it.key === 'b' ? it.b : it.a, au = it.key === 'b' ? it.b_audio : it.a_audio;
  $('#fb').innerHTML = `<div class="fb"><div>${ok ? '<b style="color:#2f6b40">정답!</b>' : '<b style="color:#c0392b">아쉬워요.</b>'}

  if (ok) play(au);
  $('#next').style.display = '';
}
function result(head) {

/* ---------- 랜덤 복습 ---------- */
let R = null;
function review(k) {
  if (!R || k === 0 && !R.keep) R = {list: shuffle(allItems()).slice(0, 10)};
  R.keep = false;
  const it = R.list[k], n = R.list.length;
  const line = it.key === 'b' ? it.b : it.a, au = it.key === 'b' ? it.b_audio : it.a_audio;
  app.innerHTML = topbar(homeBtn, `${k + 1} / ${n}`) + `<h1>랜덤 복습</h1><div class="hand">뜻 보고 떠올린 다음, 카드를 탭!</div>
    <div class="bar"><i style="width:${(k + 1) / n * 100}%"></i></div>
    <div class="flip" id="flip"><div class="inner">
      <div class="face"><div class="bigt">${esc(it.mean)}</div><div class="small">${esc(it.when)}</div><div class="hint">탭해서 뒤집기</div></div>
      <div class="face back"><div class="bigt">${esc(it.expr)}</div><div class="small">${esc(line)}</div>${pbtn(au)}
        <div class="from">${esc(it.set.date)} · ${esc(it.set.title)}</div></div></div></div>
    <div class="nav" style="margin-top:14px"><button data-rv="${k - 1}" ${k === 0 ? 'disabled' : ''}>← 이전</button>
    ${k < n - 1 ? `<button class="pri" data-rv="${k + 1}">다음 카드 →</button>` : `<button class="pri" data-go="rtest">랜덤 테스트 📝</button>`}</div>
    <div class="nav"><button data-go="set=${it.set.id}&i=${it.i}">이 세트 예습하러 가기</button></div>`;
}

/* ---------- 라우팅 ---------- */
function route() {
  const p = new URLSearchParams(location.hash.slice(1));
  window.scrollTo(0, 0);
  if (p.has('review')) return review(0);
  if (p.has('rtest')) return startTest(null);
  const s = p.get('set') && setById(p.get('set'));
  if (s) return p.get('mode') === 'test' ? startTest(s) : study(s, Math.min(Math.max(+p.get('i') || 0, 0), s.items.length - 1));
  home();
}
document.addEventListener('click', e => {
  const t = e.target.closest('button,a'); if (!t) return;
  if (t.dataset.a !== undefined) { e.stopPropagation(); return play(t.dataset.a); }
  if (t.dataset.q !== undefined) { $('#q').value = t.dataset.q; return search(t.dataset.q); }
  if (t.dataset.go !== undefined) { if (t.dataset.go === '') sessionStorage.removeItem('bravo_q'); return go(t.dataset.go); }
  if (t.dataset.o !== undefined) return answer(+t.dataset.o);
  if (t.dataset.next !== undefined) { T.k++; window.scrollTo(0, 0); return renderQ(); }
  if (t.dataset.retest !== undefined) return startTest(T.s);
  if (t.dataset.rv !== undefined) { R.keep = true; return review(+t.dataset.rv); }
});
document.addEventListener('click', e => { const f = e.target.closest('#flip'); if (f && !e.target.closest('button')) f.classList.toggle('open'); });
window.addEventListener('hashchange', route);
route();
</script></body></html>
