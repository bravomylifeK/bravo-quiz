const D = window.QUIZ;
const store = 'bravo_quiz_' + D.id;
const saved = JSON.parse(localStorage.getItem(store) || '{}');
saved.cards = saved.cards || {};
const state = {blank: {}, dialog: {}};
const $ = (s, el = document) => el.querySelector(s);
const esc = s => s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const shuffle = a => a.map(v => [Math.random(), v]).sort((x, y) => x[0] - y[0]).map(v => v[1]);
const save = () => localStorage.setItem(store, JSON.stringify(saved));
let player = null;
function play(key) { const src = D.audio[key]; if (!src) return; if (player) player.pause(); player = new Audio(src); player.play(); }
const playBtn = key => key && D.audio[key] ? `<button class="play" data-src="${key}">▶</button>` : '';

function quizCard(kind, i, item, headHtml) {
  const opts = shuffle(item.options).map(o =>
    `<button class="opt" data-kind="${kind}" data-i="${i}" data-v="${esc(o)}">${esc(o)}</button>`).join('');
  return `<div class="card"><div class="tag"><b>Q${i + 1}</b>${esc(item.situation)}</div>${headHtml}
    <div class="opts">${opts}</div><div class="fb" id="fb-${kind}-${i}"></div></div>`;
}

$('#p-blank').innerHTML = '<p class="guide">빈칸에 들어갈 표현을 골라봐요.</p>' + D.blanks.map((b, i) =>
  quizCard('blank', i, b, `<div class="sent">${esc(b.sentence).replace('____', '<span class="bl">?</span>')}</div>
  <div class="ko">${esc(b.ko)}</div>`)).join('');

$('#p-dialog').innerHTML = '<p class="guide">대화가 자연스럽게 이어지는 내 말을 골라봐요. ▶ 누르면 들려요.</p>' + D.dialog.map((d, i) =>
  quizCard('dialog', i, d, `<div class="bubble"><div class="av">상대</div><div class="bub">${esc(d.q)}
  <div class="ko">${esc(d.q_ko)}</div></div>${playBtn(d.q_audio)}</div>
  <div class="reply-label">${d.mode === 'reply' ? '내 답장은?' : '상대가 이렇게 답했어요. 내가 먼저 한 말은?'}</div>`)).join('');

function renderCards(onlyUnsure) {
  const list = D.cards.map((c, i) => [c, i]).filter(([c]) => !onlyUnsure || saved.cards[c.expr] !== 'got');
  $('#p-card').innerHTML = '<p class="guide">뜻을 보고 영어 표현을 떠올린 다음, 카드를 눌러서 확인해요.</p>' +
    (list.length ? list.map(([c, i]) => `
    <div class="flip" data-i="${i}"><div class="inner">
      <div class="face"><div class="big">${esc(c.mean)}</div><div class="small">${esc(c.when)}</div><div class="hint">탭해서 뒤집기</div></div>
      <div class="face back"><div class="big">${esc(c.expr)}</div><div class="small">${esc(c.example)}</div></div>
    </div></div>
    <div class="rate" data-expr="${esc(c.expr)}">
      <button class="got ${saved.cards[c.expr] === 'got' ? 'sel' : ''}">외웠음 ✅</button>
      <button class="unsure ${saved.cards[c.expr] === 'unsure' ? 'sel' : ''}">헷갈림 🤔</button>
    </div>`).join('') : '<div class="card">전부 외웠어요! 🎉</div>') +
    `<button class="retry" id="retry">${onlyUnsure ? '전체 카드 보기' : '헷갈린 카드만 다시 보기'}</button>`;
  $('#retry').onclick = () => renderCards(!onlyUnsure);
}
renderCards(false);

function answer(btn) {
  const {kind, i, v} = btn.dataset;
  const item = (kind === 'blank' ? D.blanks : D.dialog)[i];
  if (state[kind][i] !== undefined) return;
  const ok = v === item.answer;
  state[kind][i] = ok;
  btn.closest('.card').querySelectorAll('.opt').forEach(o => {
    o.disabled = true;
    if (o.dataset.v === item.answer) o.classList.add('right');
  });
  if (!ok) btn.classList.add('wrong');
  const fb = $(`#fb-${kind}-${i}`);
  fb.innerHTML = (ok ? '<b style="color:#2f6b40">정답!</b> ' : '<b style="color:#c0392b">아쉬워요.</b> ') +
    `${esc(item.full || item.answer)} <span class="ko">${esc(item.ko)}</span> ${playBtn(item.audio)}`;
  fb.classList.add('show');
  if (ok) play(item.audio);
  update();
}

document.addEventListener('click', e => {
  const t = e.target;
  if (t.classList.contains('play')) return play(t.dataset.src);
  if (t.classList.contains('opt')) return answer(t);
  const flip = t.closest('.flip');
  if (flip) return flip.classList.toggle('open');
  const rate = t.closest('.rate');
  if (rate && t.tagName === 'BUTTON') {
    saved.cards[rate.dataset.expr] = t.classList.contains('got') ? 'got' : 'unsure';
    rate.querySelectorAll('button').forEach(b => b.classList.toggle('sel', b === t));
    save(); update();
  }
  const tab = t.closest('.tab');
  if (tab) {
    document.querySelectorAll('.tab,.pane').forEach(el => el.classList.remove('on'));
    tab.classList.add('on'); $('#p-' + tab.dataset.p).classList.add('on');
  }
});

function update() {
  const nB = Object.keys(state.blank).length, nD = Object.keys(state.dialog).length;
  const rated = D.cards.filter(c => saved.cards[c.expr]).length;
  const got = D.cards.filter(c => saved.cards[c.expr] === 'got').length;
  $('[data-p=blank]').classList.toggle('done', nB === D.blanks.length);
  $('[data-p=dialog]').classList.toggle('done', nD === D.dialog.length);
  $('[data-p=card]').classList.toggle('done', rated === D.cards.length);
  const total = D.blanks.length + D.dialog.length + D.cards.length;
  const done = nB + nD + rated;
  $('#prog').textContent = `${done} / ${total}`;
  if (done === total) {
    const right = Object.values(state.blank).filter(Boolean).length + Object.values(state.dialog).filter(Boolean).length + got;
    $('#score').textContent = `${right} / ${total}`;
    $('#msg').textContent = right === total ? 'perfect!' : right >= total * 0.7 ? 'almost there!' : 'one more time!';
    $('#result').classList.add('show');
    saved.done = {right, total}; save();
  }
}
update();
</script></body></html>
